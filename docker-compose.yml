services:
  db:
    image: postgres:17-alpine
    network_mode: host
    environment:
      POSTGRES_DB: tis
      POSTGRES_USER: tis
      POSTGRES_PASSWORD: tis
      PGPORT: 5432
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U tis -d tis"]
      interval: 2s
      timeout: 2s
      retries: 20

  backend:
    build:
      context: ./backend
      network: host
    network_mode: host
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      network: host
    network_mode: host
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  dbdata: {}
